<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次回訪問日の一覧</title>
<style>
  :root {
    --ink: #2b2b2e;
    --muted: #8c8a85;
    --line: #e4e1da;
    --bg: #f3f1ec;
    --card: #fbfaf7;
    --accent: #9a8466;
    --warn: #b56a4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", -apple-system, serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 44px 38px 38px;
    box-shadow: 0 18px 50px rgba(60, 50, 35, 0.08);
  }

  .eyebrow {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    text-transform: uppercase;
    color: #b3a384;
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 22px;
  }

  /* モード切替 */
  .modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 26px;
  }
  .mode-btn {
    padding: 12px 0;
    text-align: center;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
  }
  .mode-btn small {
    display: block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 3px;
  }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .mode-btn.active small { color: rgba(255,255,255,0.6); }

  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 9px;
  }

  input[type="text"],
  input[type="date"],
  select {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .field { margin-bottom: 20px; }
  [hidden] { display: none !important; }

  /* 対象週チェックボックス */
  .weeks-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .wk {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 11px 0;
    font-size: 0.92rem;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .wk input { position: absolute; opacity: 0; pointer-events: none; }
  .wk.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  button.calc {
    width: 100%;
    padding: 15px;
    margin-top: 4px;
    font-size: 0.92rem;
    font-family: inherit;
    letter-spacing: 0.16em;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.25s;
  }
  button.calc:hover { background: #000; }

  /* 一覧 */
  .list {
    margin-top: 32px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .list.show { opacity: 1; transform: translateY(0); }

  .list-head {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #b3a384;
    text-align: center;
    margin-bottom: 6px;
  }
  .base-line {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 2px;
    border-top: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row .term {
    flex: 0 0 auto;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    min-width: 64px;
  }
  .row .term small {
    display: block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.58rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 2px;
  }
  .row .val { text-align: right; flex: 1 1 auto; }
  .row .date { font-size: 1.05rem; font-weight: 600; }
  .row .date .wd { font-size: 0.88rem; color: var(--muted); font-weight: 400; }
  .row.flagged .date { color: var(--warn); }
  .row .mk {
    display: inline-block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    color: var(--warn);
    background: #f7efe9;
    border: 1px solid #ecdfd4;
    border-radius: 3px;
    padding: 1px 7px;
    margin-top: 5px;
  }

  button.ics {
    width: 100%;
    margin-top: 26px;
    padding: 15px;
    font-size: 0.9rem;
    font-family: inherit;
    letter-spacing: 0.12em;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.25s;
  }
  button.ics:hover { background: #85704f; }

  .feedback {
    margin-top: 14px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--accent);
    min-height: 1.2em;
  }

  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .footer .dot { color: var(--warn); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Follow-up Schedule</div>
    <h1 id="title">次回訪問日の一覧</h1>
    <div class="rule"></div>

    <!-- モード切替 -->
    <div class="modes" id="modes">
      <div class="mode-btn active" data-mode="ex">EX<small>導入後</small></div>
      <div class="mode-btn" data-mode="nu">NU<small>投与中</small></div>
    </div>

    <!-- 医師名（共通） -->
    <div class="field">
      <label for="doctor">医師名（任意）</label>
      <input type="text" id="doctor" placeholder="例：村中先生" autocomplete="off">
    </div>

    <!-- EX専用：切り替え元 -->
    <div class="field" id="sourceField">
      <label for="source">切り替え元</label>
      <select id="source">
        <option value="FSN">FSN</option>
        <option value="NU">NU</option>
        <option value="TZP">TZP</option>
        <option value="DUP">DUP</option>
        <option value="NUC">NUC</option>
        <option value="__other">その他（自由入力）</option>
      </select>
      <input type="text" id="sourceCustom" placeholder="略号を入力" autocomplete="off" style="margin-top:8px;" hidden>
    </div>

    <!-- 基準日（共通・ラベルはモードで変化） -->
    <div class="field">
      <label for="baseDate" id="baseLabel">基準となる日付</label>
      <input type="date" id="baseDate">
    </div>

    <!-- EX専用：対象週 -->
    <div class="field" id="weeksField">
      <label>対象週（＝EX導入から◯週目）</label>
      <div class="weeks-grid" id="weeksGrid"></div>
    </div>

    <button class="calc" id="calcBtn">一 覧 を 表 示</button>

    <!-- 一覧 -->
    <div class="list" id="list">
      <div class="list-head">Schedule</div>
      <div class="base-line" id="baseLine"></div>
      <div id="rows"></div>
      <button class="ics" id="icsBtn">カレンダーに追加（.ics）</button>
      <div class="feedback" id="feedback"></div>
      <div class="footer">
        <span class="dot">●</span> .ics には常に元の候補日を書き出します。土日・祝日の回は件名に <b>※土日 / ※祝日</b> を付与します。
      </div>
    </div>
  </div>

<script>
/* ============================================================

   最終更新：2026-09（生成時点の確定祝日）
   ============================================================ */
const HOLIDAYS = {

  "2026-01-01": "元日", "2026-01-12": "成人の日", "2026-02-11": "建国記念の日",
  "2026-02-23": "天皇誕生日", "2026-03-20": "春分の日", "2026-04-29": "昭和の日",

  "2026-10-12": "スポーツの日", "2026-11-03": "文化の日", "2026-11-23": "勤労感謝の日",
  "2027-01-01": "元日", "2027-01-11": "成人の日", "2027-02-11": "建国記念の日",
  "2027-02-23": "天皇誕生日", "2027-03-21": "春分の日", "2027-03-22": "振替休日",
  "2027-04-29": "昭和の日", "2027-05-03": "憲法記念日", "2027-05-04": "みどりの日",
  "2027-05-05": "こどもの日", "2027-07-19": "海の日", "2027-08-11": "山の日",
  "2027-09-20": "敬老の日", "2027-09-23": "秋分の日", "2027-10-11": "スポーツの日",
  "2027-11-03": "文化の日", "2027-11-23": "勤労感謝の日",
  "2028-01-01": "元日", "2028-01-10": "成人の日", "2028-02-11": "建国記念の日",
  "2028-02-23": "天皇誕生日", "2028-03-20": "春分の日", "2028-04-29": "昭和の日",
  "2028-05-03": "憲法記念日", "2028-05-04": "みどりの日", "2028-05-05": "こどもの日",
  "2028-07-17": "海の日", "2028-08-11": "山の日", "2028-09-18": "敬老の日",
  "2028-09-22": "秋分の日", "2028-10-09": "スポーツの日", "2028-11-03": "文化の日",

  "2029-01-01": "元日", "2029-01-08": "成人の日", "2029-02-11": "建国記念の日",
  "2029-02-12": "振替休日", "2029-02-23": "天皇誕生日", "2029-03-20": "春分の日",
  "2029-04-29": "昭和の日", "2029-04-30": "振替休日", "2029-05-03": "憲法記念日",
  "2029-05-04": "みどりの日", "2029-05-05": "こどもの日", "2029-07-16": "海の日",
  "2029-08-11": "山の日", "2029-09-17": "敬老の日", "2029-09-23": "秋分の日",
  "2029-09-24": "振替休日", "2029-10-08": "スポーツの日", "2029-11-03": "文化の日",
  "2029-11-23": "勤労感謝の日",
  "2030-01-01": "元日", "2030-01-14": "成人の日", "2030-02-11": "建国記念の日",
  "2030-02-23": "天皇誕生日", "2030-03-20": "春分の日", "2030-04-29": "昭和の日",
  "2030-05-03": "憲法記念日", "2030-05-04": "みどりの日", "2030-05-05": "こどもの日",
  "2030-05-06": "振替休日", "2030-07-15": "海の日", "2030-08-11": "山の日",
  "2030-08-12": "振替休日", "2030-09-16": "敬老の日", "2030-09-23": "秋分の日",
  "2030-10-14": "スポーツの日", "2030-11-03": "文化の日", "2030-11-04": "振替休日",
  "2030-11-23": "勤労感謝の日"
};

const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
const EX_WEEKS = [4, 8, 12, 13, 16, 20, 24, 26];
const NU_WEEKS = [4, 8, 12, 16, 20, 24];
const LS = { mode: "v26_mode", source: "v26_source", sourceCustom: "v26_sourceCustom", weeks: "v26_weeks" };

/* ---------- 日付ユーティリティ ---------- */
function p2(n){ return String(n).padStart(2, "0"); }
function keyOf(d){ return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function addWeeks(base, w){ return new Date(base.getFullYear(), base.getMonth(), base.getDate() + w * 7); }
function fmt(d){ return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
function icsDate(d){ return `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}`; }

// 土日・祝日マーカー（祝日優先）
function markerOf(d){
  if (HOLIDAYS[keyOf(d)]) return "※祝日";
  const wd = d.getDay();
  if (wd === 0 || wd === 6) return "※土日";
  return "";
}

/* ---------- localStorage ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- DOM ---------- */
const modes = document.getElementById("modes");
const title = document.getElementById("title");
const doctor = document.getElementById("doctor");
const sourceField = document.getElementById("sourceField");
const source = document.getElementById("source");
const sourceCustom = document.getElementById("sourceCustom");
const weeksField = document.getElementById("weeksField");
const weeksGrid = document.getElementById("weeksGrid");
const baseLabel = document.getElementById("baseLabel");
const input = document.getElementById("baseDate");
const calcBtn = document.getElementById("calcBtn");
const list = document.getElementById("list");
const rows = document.getElementById("rows");
const baseLine = document.getElementById("baseLine");
const icsBtn = document.getElementById("icsBtn");
const feedback = document.getElementById("feedback");

let mode = "ex";

/* ---------- 対象週チェックボックス生成 ---------- */
function buildWeekChips(){
  const saved = (() => { try { return JSON.parse(lsGet(LS.weeks)); } catch(e){ return null; } })();
  const on = Array.isArray(saved) ? saved : EX_WEEKS.slice();
  weeksGrid.innerHTML = "";
  EX_WEEKS.forEach(w => {
    const lab = document.createElement("label");
    lab.className = "wk" + (on.includes(w) ? " on" : "");
    lab.innerHTML = `<input type="checkbox" value="${w}" ${on.includes(w) ? "checked" : ""}>${w}週`;
    const cb = lab.querySelector("input");
    cb.addEventListener("change", () => {
      lab.classList.toggle("on", cb.checked);
      lsSet(LS.weeks, JSON.stringify(getCheckedWeeks()));
    });
    weeksGrid.appendChild(lab);
  });
}
function getCheckedWeeks(){
  return [...weeksGrid.querySelectorAll("input:checked")].map(c => Number(c.value));
}

/* ---------- モード切替 ---------- */
function setMode(m){
  mode = m;
  [...modes.children].forEach(b => b.classList.toggle("active", b.dataset.mode === m));
  const isEx = m === "ex";
  sourceField.hidden = !isEx;
  weeksField.hidden = !isEx;
  title.textContent = isEx ? "次回訪問日の一覧" : "NU投与日の一覧";
  baseLabel.textContent = isEx ? "基準となる日付（EX導入日）" : "基準となる日付（直近の投与日）";
  list.classList.remove("show");
  feedback.textContent = "";
  lsSet(LS.mode, m);
}

/* ---------- 切り替え元 ---------- */
function currentSource(){
  return source.value === "__other" ? (sourceCustom.value.trim() || "その他") : source.value;
}
source.addEventListener("change", () => {
  sourceCustom.hidden = source.value !== "__other";
  lsSet(LS.source, source.value);
});
sourceCustom.addEventListener("input", () => lsSet(LS.sourceCustom, sourceCustom.value));

/* ---------- 件名生成 ---------- */
function subjectOf(name, w, target){
  const mk = markerOf(target);
  if (mode === "ex"){
    return `${name}EX${w}週目（${currentSource()}→）${mk}`;
  }
  return `${name}NU投与日${mk}`;
}

/* ---------- 対象日リスト構築 ---------- */
function buildContext(){
  const val = input.value;
  if (!val){ input.focus(); return null; }
  const [y, m, d] = val.split("-").map(Number);
  const base = new Date(y, m - 1, d);
  const weeks = mode === "ex" ? getCheckedWeeks() : NU_WEEKS.slice();
  if (weeks.length === 0) return { base, name: doctor.value.trim(), items: [] };
  const items = weeks.map(w => {
    const t = addWeeks(base, w);
    return { w, date: t, marker: markerOf(t), holName: HOLIDAYS[keyOf(t)] || "" };
  });
  return { base, name: doctor.value.trim(), items };
}

/* ---------- 一覧描画 ---------- */
function render(){
  const ctx = buildContext();
  if (!ctx) return;
  baseLine.textContent = `基準日：${fmt(ctx.base)}（${weekdays[ctx.base.getDay()]}）`;
  rows.innerHTML = "";
  if (ctx.items.length === 0){
    rows.innerHTML = `<div class="row"><div class="term" style="color:var(--muted)">対象週が選択されていません</div></div>`;
  }
  ctx.items.forEach(it => {
    const termLabel = mode === "ex" ? `${it.w}週目` : `+${it.w}週`;
    const mkHtml = it.marker
      ? `<div class="mk">${it.marker}${it.holName ? "（" + it.holName + "）" : ""}</div>`
      : "";
    const row = document.createElement("div");
    row.className = "row" + (it.marker ? " flagged" : "");
    row.innerHTML =
      `<div class="term">${termLabel}<small>${it.w * 7} DAYS</small></div>` +
      `<div class="val">` +
        `<div class="date">${fmt(it.date)} <span class="wd">（${weekdays[it.date.getDay()]}）</span></div>` +
        mkHtml +
      `</div>`;
    rows.appendChild(row);
  });
  feedback.textContent = "";
  list.classList.remove("show");
  void list.offsetWidth;
  list.classList.add("show");
}

/* ============================================================
   .ics 生成
   ============================================================ */
function hashStr(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function rand(){ return Math.random().toString(36).slice(2, 8); }
function dtstampUTC(){
  const n = new Date();
  return `${n.getUTCFullYear()}${p2(n.getUTCMonth() + 1)}${p2(n.getUTCDate())}` +
         `T${p2(n.getUTCHours())}${p2(n.getUTCMinutes())}${p2(n.getUTCSeconds())}Z`;
}
function escICS(s){
  return String(s)
    .replace(/\\/g, "\\\\")
    .replace(/;/g, "\\;")
    .replace(/,/g, "\\,")
    .replace(/\r?\n/g, "\\n");
}
// 75オクテット折り返し（マルチバイト文字を分割しない）
function foldLine(line){
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  const out = [];
  let cur = "", curBytes = 0, first = true;
  for (const ch of line){
    const b = enc.encode(ch).length;
    const cap = first ? 75 : 74; // 継続行は先頭に空白1文字が入る
    if (curBytes + b > cap){
      out.push((first ? "" : " ") + cur);
      first = false;
      cur = ch; curBytes = b;
    } else {
      cur += ch; curBytes += b;
    }
  }
  out.push((first ? "" : " ") + cur);
  return out.join("\r\n");
}

function buildICS(ctx){
  const stamp = dtstampUTC();
  const nameHash = hashStr(ctx.name || "noname");
  const srcSafe = (currentSource().replace(/[^A-Za-z0-9]/g, "") || "x");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//harnoh//26weeks//JA",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ];
  ctx.items.forEach(it => {
    const start = icsDate(it.date);
    const end = icsDate(new Date(it.date.getFullYear(), it.date.getMonth(), it.date.getDate() + 1));
    const uid = mode === "ex"
      ? `${nameHash}-${srcSafe}-${it.w}w-${start}-${rand()}@harnoh.github.io`
      : `${nameHash}-nu-${start}-${rand()}@harnoh.github.io`;
    const summary = subjectOf(ctx.name, it.w, it.date);
    lines.push(
      "BEGIN:VEVENT",
      `UID:${uid}`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${start}`,
      `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${escICS(summary)}`,
      "TRANSP:TRANSPARENT",
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.map(foldLine).join("\r\n") + "\r\n";
}

function sanitizeFile(s){ return s.replace(/[\/\\:*?"<>|]/g, "").trim(); }
function icsFileName(ctx){
  const namePart = sanitizeFile(ctx.name);
  const dateStr = icsDate(ctx.base);
  if (mode === "ex"){
    const src = sanitizeFile(currentSource()) || "x";
    return `${namePart ? namePart + "_" : ""}EX_${src}_${dateStr}.ics`;
  }
  return `${namePart ? namePart + "_" : ""}NU_${dateStr}.ics`;
}

function downloadBlob(text, fileName){
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function exportICS(){
  const ctx = buildContext();
  if (!ctx) return;
  if (ctx.items.length === 0){ feedback.textContent = "対象週を1つ以上選んでください。"; return; }
  const text = buildICS(ctx);
  const fileName = icsFileName(ctx);
  const count = ctx.items.length;

  // 第1優先：Web Share API（iOS Safari → 共有シート → カレンダー）
  try {
    const file = new File([text], fileName, { type: "text/calendar" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: fileName });
      feedback.textContent = `${count}件を書き出しました。`;
      return;
    }
  } catch(e){
    if (e && e.name === "AbortError") return; // キャンセルはエラー扱いしない
    // それ以外の共有失敗はダウンロードにフォールバック
  }
  // 第2優先：Blobダウンロード
  downloadBlob(text, fileName);
  feedback.textContent = `${count}件を書き出しました（ダウンロード）。`;
}

/* ---------- 初期化 ---------- */
function init(){
  input.value = new Date().toISOString().slice(0, 10);
  buildWeekChips();

  // localStorage 復元（医師名・基準日は除く）
  const savedSource = lsGet(LS.source);
  if (savedSource){
    source.value = savedSource;
    sourceCustom.hidden = savedSource !== "__other";
  }
  const savedCustom = lsGet(LS.sourceCustom);
  if (savedCustom) sourceCustom.value = savedCustom;

  modes.addEventListener("click", (e) => {
    const b = e.target.closest(".mode-btn");
    if (b) setMode(b.dataset.mode);
  });
  calcBtn.addEventListener("click", render);
  icsBtn.addEventListener("click", exportICS);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") render(); });
  doctor.addEventListener("keydown", (e) => { if (e.key === "Enter") render(); });

  setMode(lsGet(LS.mode) === "nu" ? "nu" : "ex");
}
init();
</script>
