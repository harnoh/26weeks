<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次回訪問日の計算</title>
<style>
  :root {
    --ink: #2b2b2e;
    --muted: #8c8a85;
    --line: #e4e1da;
    --bg: #f3f1ec;
    --card: #fbfaf7;
    --accent: #9a8466;
    --warn: #b56a4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", -apple-system, serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 40px 40px;
    box-shadow: 0 18px 50px rgba(60, 50, 35, 0.08);
  }

  .eyebrow {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    text-transform: uppercase;
    color: #b3a384;
    text-align: center;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 16px;
  }

  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* 週数セレクタ */
  .weeks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .chip {
    padding: 12px 0;
    text-align: center;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
  }
  .chip small {
    display: block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 3px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .chip.active small { color: rgba(255,255,255,0.6); }

  input[type="date"] {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    margin-bottom: 22px;
    transition: border-color 0.2s;
  }
  input[type="date"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button.calc {
    width: 100%;
    padding: 15px;
    font-size: 0.92rem;
    font-family: inherit;
    letter-spacing: 0.16em;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.25s;
  }
  button.calc:hover { background: #000; }

  .result {
    margin-top: 32px;
    padding-top: 30px;
    border-top: 1px solid var(--line);
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .result.show { opacity: 1; transform: translateY(0); }

  .result .label {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #b3a384;
    margin-bottom: 14px;
  }
  .result .date {
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .result .weekday {
    font-size: 1rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .result .note {
    margin-top: 16px;
    font-size: 0.76rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* 祝日・土日の注意と代替候補 */
  .flag {
    margin-top: 20px;
    padding: 16px 18px;
    background: #f7efe9;
    border: 1px solid #ecdfd4;
    border-radius: 4px;
    text-align: left;
    font-size: 0.82rem;
    line-height: 1.7;
    color: #7a5a45;
    display: none;
  }
  .flag.show { display: block; }
  .flag .flag-title {
    font-weight: 600;
    color: var(--warn);
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
  }
  .flag .flag-title::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--warn);
  }
  .flag .alt {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #e0cdbd;
  }
  .flag .alt b { font-size: 0.95rem; color: #6a4a35; }

  .footer {
    margin-top: 30px;
    text-align: center;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #c4bdb0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Follow-up Date</div>
    <h1>次回訪問日の計算</h1>
    <div class="rule"></div>
    <p class="sub">基準日から選んだ週数のちょうど後の日付を、<br>曜日つきでお調べします。</p>

    <label>間隔を選択</label>
    <div class="weeks" id="weeks">
      <div class="chip" data-w="4">4週<small>28 DAYS</small></div>
      <div class="chip" data-w="8">8週<small>56 DAYS</small></div>
      <div class="chip" data-w="12">12週<small>84 DAYS</small></div>
      <div class="chip active" data-w="26">26週<small>182 DAYS</small></div>
    </div>

    <label for="baseDate">基準となる日付</label>
    <input type="date" id="baseDate">
    <button class="calc" id="calcBtn">計 算 す る</button>

    <div class="result" id="result">
      <div class="label" id="resultLabel">26 weeks later</div>
      <div class="date" id="resultDate"></div>
      <div class="weekday" id="resultWeekday"></div>
      <div class="note" id="resultNote"></div>

      <div class="flag" id="flag">
        <div class="flag-title" id="flagTitle"></div>
        <div id="flagBody"></div>
        <div class="alt" id="flagAlt"></div>
      </div>
    </div>

    <div class="footer" id="footer">26 WEEKS = 182 DAYS</div>
  </div>

<script>
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

  /* ---------- 日本の祝日計算 ---------- */
  function pad(n){ return String(n).padStart(2, "0"); }
  function key(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nthMonday(year, month, n){
    const first = new Date(year, month - 1, 1);
    let day = 1 + ((8 - first.getDay()) % 7) + (n - 1) * 7;
    return new Date(year, month - 1, day);
  }
  function shunbun(year){ return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
  function shubun(year){ return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }

  function baseHolidays(year){
    const h = new Map();
    const add = (m, d, name) => h.set(key(new Date(year, m - 1, d)), name);
    add(1, 1, "元日");
    h.set(key(nthMonday(year, 1, 2)), "成人の日");
    add(2, 11, "建国記念の日");
    if (year >= 2020) add(2, 23, "天皇誕生日");
    h.set(key(new Date(year, 2, shunbun(year))), "春分の日");
    add(4, 29, "昭和の日");
    add(5, 3, "憲法記念日");
    add(5, 4, "みどりの日");
    add(5, 5, "こどもの日");
    h.set(key(nthMonday(year, 7, 3)), "海の日");
    add(8, 11, "山の日");
    h.set(key(nthMonday(year, 9, 3)), "敬老の日");
    h.set(key(new Date(year, 8, shubun(year))), "秋分の日");
    h.set(key(nthMonday(year, 10, 2)), "スポーツの日");
    add(11, 3, "文化の日");
    add(11, 23, "勤労感謝の日");
    return h;
  }

  // 指定年群の祝日（振替休日・国民の休日を含む）
  function buildHolidays(years){
    const base = new Map();
    years.forEach(y => baseHolidays(y).forEach((v, k) => base.set(k, v)));
    const result = new Map(base);
    // 振替休日: 祝日が日曜なら、翌日以降の最初の非祝日を振替休日に
    [...base.keys()].sort().forEach(k => {
      const parts = k.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (d.getDay() === 0){
        const n = new Date(d);
        do { n.setDate(n.getDate() + 1); } while (result.has(key(n)));
        result.set(key(n), "振替休日");
      }
    });
    // 国民の休日: 前後を祝日に挟まれた平日
    const minY = Math.min(...years), maxY = Math.max(...years);
    for (let y = minY; y <= maxY; y++){
      for (let m = 0; m < 12; m++){
        const dim = new Date(y, m + 1, 0).getDate();
        for (let dd = 1; dd <= dim; dd++){
          const d = new Date(y, m, dd);
          if (d.getDay() === 0 || result.has(key(d))) continue;
          const prev = key(new Date(y, m, dd - 1));
          const next = key(new Date(y, m, dd + 1));
          if (result.has(prev) && result.has(next)) result.set(key(d), "国民の休日");
        }
      }
    }
    return result;
  }

  function isWeekend(d){ return d.getDay() === 0 || d.getDay() === 6; }
  function isBusinessDay(d, hol){ return !isWeekend(d) && !hol.has(key(d)); }

  /* ---------- UI ---------- */
  const input = document.getElementById("baseDate");
  const btn = document.getElementById("calcBtn");
  const chips = document.getElementById("weeks");
  const footer = document.getElementById("footer");
  const result = document.getElementById("result");
  const resultLabel = document.getElementById("resultLabel");
  const resultDate = document.getElementById("resultDate");
  const resultWeekday = document.getElementById("resultWeekday");
  const resultNote = document.getElementById("resultNote");
  const flag = document.getElementById("flag");
  const flagTitle = document.getElementById("flagTitle");
  const flagBody = document.getElementById("flagBody");
  const flagAlt = document.getElementById("flagAlt");

  let weeks = 26;

  input.value = new Date().toISOString().slice(0, 10);

  chips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    [...chips.children].forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    weeks = Number(chip.dataset.w);
    footer.textContent = `${weeks} WEEKS = ${weeks * 7} DAYS`;
  });

  function fmt(d){ return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }

  function calculate(){
    const val = input.value;
    if (!val){ input.focus(); return; }
    const [y, m, d] = val.split("-").map(Number);
    const base = new Date(y, m - 1, d);

    const target = new Date(base);
    target.setDate(target.getDate() + weeks * 7);

    // 祝日マップ（前後年もカバー）
    const hol = buildHolidays([base.getFullYear() - 1, base.getFullYear(), target.getFullYear(), target.getFullYear() + 1]);

    resultLabel.textContent = `${weeks} weeks later`;
    resultDate.textContent = fmt(target);
    resultWeekday.textContent = `${weekdays[target.getDay()]}曜日`;
    resultNote.textContent = `${fmt(base)} の ${weeks * 7}日後（ちょうど${weeks}週後）`;

    // 土日・祝日の判定
    const holName = hol.get(key(target));
    const weekend = isWeekend(target);
    if (holName || weekend){
      let reason;
      if (holName && weekend) reason = `${weekdays[target.getDay()]}曜日・${holName}`;
      else if (holName) reason = holName;
      else reason = `${weekdays[target.getDay()]}曜日（週末）`;
      flagTitle.textContent = "この日は休業日に当たります";
      flagBody.textContent = `ちょうど${weeks}週後は「${reason}」です。`;

      // 最寄りの平日（土日・祝日を除く）を提案。同距離なら前を優先。
      let alt = null;
      for (let off = 1; off <= 21 && !alt; off++){
        const before = new Date(target); before.setDate(before.getDate() - off);
        const after = new Date(target); after.setDate(after.getDate() + off);
        if (isBusinessDay(before, hol)) alt = before;
        else if (isBusinessDay(after, hol)) alt = after;
      }
      if (alt){
        const diff = Math.round((alt - target) / 86400000);
        const dir = diff < 0 ? `${Math.abs(diff)}日前` : `${diff}日後`;
        flagAlt.innerHTML = `最寄りの平日 &rarr; <b>${fmt(alt)}（${weekdays[alt.getDay()]}）</b><br><span style="font-size:0.76rem;color:#a08a76;">対象日から${dir}</span>`;
      } else {
        flagAlt.textContent = "";
      }
      flag.classList.add("show");
    } else {
      flag.classList.remove("show");
    }

    result.classList.remove("show");
    void result.offsetWidth;
    result.classList.add("show");
  }

  btn.addEventListener("click", calculate);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") calculate(); });
</script>
</body>
</html>
