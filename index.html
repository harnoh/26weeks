<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次回訪問日の一覧</title>
<style>
  :root {
    --ink: #2b2b2e;
    --muted: #8c8a85;
    --line: #e4e1da;
    --bg: #f3f1ec;
    --card: #fbfaf7;
    --accent: #9a8466;
    --warn: #b56a4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", -apple-system, serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 40px 40px;
    box-shadow: 0 18px 50px rgba(60, 50, 35, 0.08);
  }

  .eyebrow {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    text-transform: uppercase;
    color: #b3a384;
    text-align: center;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 16px;
  }

  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  input[type="date"] {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    margin-bottom: 22px;
    transition: border-color 0.2s;
  }
  input[type="date"]:focus { outline: none; border-color: var(--accent); }

  button.calc {
    width: 100%;
    padding: 15px;
    font-size: 0.92rem;
    font-family: inherit;
    letter-spacing: 0.16em;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.25s;
  }
  button.calc:hover { background: #000; }

  /* 一覧 */
  .list {
    margin-top: 34px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .list.show { opacity: 1; transform: translateY(0); }

  .list-head {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #b3a384;
    text-align: center;
    margin-bottom: 6px;
  }
  .base-line {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 2px;
    border-top: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 1px solid var(--line); }

  .row .term {
    flex: 0 0 auto;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    min-width: 68px;
  }
  .row .term small {
    display: block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.58rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 2px;
  }
  .row .val { text-align: right; flex: 1 1 auto; }
  .row .date {
    font-size: 1.08rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .row .date .wd { font-size: 0.9rem; color: var(--muted); font-weight: 400; }

  .row.holiday .date { color: var(--warn); }
  .row .flag {
    margin-top: 5px;
    font-size: 0.74rem;
    line-height: 1.6;
    color: #9a7358;
  }
  .row .flag .tag {
    display: inline-block;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    color: var(--warn);
    background: #f7efe9;
    border: 1px solid #ecdfd4;
    border-radius: 3px;
    padding: 1px 7px;
    margin-right: 6px;
  }
  .row .flag b { color: #6a4a35; font-weight: 600; }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .footer .note-hol { color: var(--warn); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Follow-up Schedule</div>
    <h1>次回訪問日の一覧</h1>
    <div class="rule"></div>
    <p class="sub">基準日を入力すると、4〜26週後の候補日を<br>まとめて一覧で表示します。</p>

    <label for="baseDate">基準となる日付</label>
    <input type="date" id="baseDate">
    <button class="calc" id="calcBtn">一 覧 を 表 示</button>

    <div class="list" id="list">
      <div class="list-head">Schedule</div>
      <div class="base-line" id="baseLine"></div>
      <div id="rows"></div>
      <div class="footer">
        <span class="note-hol">●</span> 土日・祝日に当たる回は最寄りの平日を併記しています。
      </div>
    </div>
  </div>

<script>
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
  const INTERVALS = [4, 8, 12, 13, 16, 20, 24, 26];

  /* ---------- 日本の祝日計算 ---------- */
  function pad(n){ return String(n).padStart(2, "0"); }
  function key(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nthMonday(year, month, n){
    const first = new Date(year, month - 1, 1);
    let day = 1 + ((8 - first.getDay()) % 7) + (n - 1) * 7;
    return new Date(year, month - 1, day);
  }
  function shunbun(year){ return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
  function shubun(year){ return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }

  function baseHolidays(year){
    const h = new Map();
    const add = (m, d, name) => h.set(key(new Date(year, m - 1, d)), name);
    add(1, 1, "元日");
    h.set(key(nthMonday(year, 1, 2)), "成人の日");
    add(2, 11, "建国記念の日");
    if (year >= 2020) add(2, 23, "天皇誕生日");
    h.set(key(new Date(year, 2, shunbun(year))), "春分の日");
    add(4, 29, "昭和の日");
    add(5, 3, "憲法記念日");
    add(5, 4, "みどりの日");
    add(5, 5, "こどもの日");
    h.set(key(nthMonday(year, 7, 3)), "海の日");
    add(8, 11, "山の日");
    h.set(key(nthMonday(year, 9, 3)), "敬老の日");
    h.set(key(new Date(year, 8, shubun(year))), "秋分の日");
    h.set(key(nthMonday(year, 10, 2)), "スポーツの日");
    add(11, 3, "文化の日");
    add(11, 23, "勤労感謝の日");
    return h;
  }

  function buildHolidays(years){
    const base = new Map();
    years.forEach(y => baseHolidays(y).forEach((v, k) => base.set(k, v)));
    const result = new Map(base);
    [...base.keys()].sort().forEach(k => {
      const p = k.split("-").map(Number);
      const d = new Date(p[0], p[1] - 1, p[2]);
      if (d.getDay() === 0){
        const n = new Date(d);
        do { n.setDate(n.getDate() + 1); } while (result.has(key(n)));
        result.set(key(n), "振替休日");
      }
    });
    const minY = Math.min(...years), maxY = Math.max(...years);
    for (let y = minY; y <= maxY; y++){
      for (let m = 0; m < 12; m++){
        const dim = new Date(y, m + 1, 0).getDate();
        for (let dd = 1; dd <= dim; dd++){
          const d = new Date(y, m, dd);
          if (d.getDay() === 0 || result.has(key(d))) continue;
          const prev = key(new Date(y, m, dd - 1));
          const next = key(new Date(y, m, dd + 1));
          if (result.has(prev) && result.has(next)) result.set(key(d), "国民の休日");
        }
      }
    }
    return result;
  }

  function isWeekend(d){ return d.getDay() === 0 || d.getDay() === 6; }
  function isBusinessDay(d, hol){ return !isWeekend(d) && !hol.has(key(d)); }
  function fmt(d){ return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
  function fmtShort(d){ return `${d.getMonth() + 1}月${d.getDate()}日`; }

  /* ---------- UI ---------- */
  const input = document.getElementById("baseDate");
  const btn = document.getElementById("calcBtn");
  const list = document.getElementById("list");
  const rows = document.getElementById("rows");
  const baseLine = document.getElementById("baseLine");

  input.value = new Date().toISOString().slice(0, 10);

  function calculate(){
    const val = input.value;
    if (!val){ input.focus(); return; }
    const [y, m, d] = val.split("-").map(Number);
    const base = new Date(y, m - 1, d);

    const maxTarget = new Date(base);
    maxTarget.setDate(maxTarget.getDate() + 26 * 7);
    const hol = buildHolidays([base.getFullYear() - 1, base.getFullYear(), maxTarget.getFullYear(), maxTarget.getFullYear() + 1]);

    baseLine.textContent = `基準日：${fmt(base)}（${weekdays[base.getDay()]}）`;

    rows.innerHTML = "";
    INTERVALS.forEach(w => {
      const t = new Date(base);
      t.setDate(t.getDate() + w * 7);
      const holName = hol.get(key(t));
      const weekend = isWeekend(t);
      const isHol = !!(holName || weekend);

      let flagHtml = "";
      if (isHol){
        const reason = holName ? holName : `${weekdays[t.getDay()]}曜日`;
        let alt = null;
        for (let off = 1; off <= 21 && !alt; off++){
          const before = new Date(t); before.setDate(before.getDate() - off);
          const after = new Date(t); after.setDate(after.getDate() + off);
          if (isBusinessDay(before, hol)) alt = before;
          else if (isBusinessDay(after, hol)) alt = after;
        }
        const altHtml = alt ? ` → 平日は <b>${fmtShort(alt)}（${weekdays[alt.getDay()]}）</b>` : "";
        flagHtml = `<div class="flag"><span class="tag">${reason}</span>${altHtml}</div>`;
      }

      const row = document.createElement("div");
      row.className = "row" + (isHol ? " holiday" : "");
      row.innerHTML =
        `<div class="term">${w}週後<small>${w * 7} DAYS</small></div>` +
        `<div class="val">` +
          `<div class="date">${fmt(t)} <span class="wd">（${weekdays[t.getDay()]}）</span></div>` +
          flagHtml +
        `</div>`;
      rows.appendChild(row);
    });

    list.classList.remove("show");
    void list.offsetWidth;
    list.classList.add("show");
  }

  btn.addEventListener("click", calculate);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") calculate(); });
</script>
</body>
</html>
